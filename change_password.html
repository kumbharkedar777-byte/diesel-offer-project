<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f2f4f7;">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary px-3">

        <div class="container-fluid">

            <h3 class="text-white">
                Change Password
            </h3>

            <a href="idx.html"
               class="btn btn-light">

                Back

            </a>

        </div>

    </nav>

    <!-- FORM -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h3 class="mb-4">
                        Update Password
                    </h3>

                    <form id="passwordForm">

                        <!-- USERNAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- OLD PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Old Password
                            </label>

                            <input
                                type="password"
                                id="oldPassword"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- NEW PASSWORD -->

                        <div class="mb-4">

                            <label class="form-label">
                                New Password
                            </label>

                            <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Change Password

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="change_password.js"></script>

</body>

</html>

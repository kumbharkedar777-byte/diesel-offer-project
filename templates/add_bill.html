<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Bill</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-dark bg-primary px-3">

        <div class="container-fluid">

            <h3 class="text-white">
                Add Bill
            </h3>

            <a href="/templates/idx.html"
               class="btn btn-light">

                Back

            </a>

        </div>

    </nav>

   <div class="container mt-4">

    <div class="card shadow p-4">

        <h3 class="mb-4 text-center">
            Add New Bill
        </h3>

        <form id="billForm">

            <!-- Mobile Number -->

            <div class="mb-3">

                <label class="form-label">
                    Mobile Number
                </label>

                <input type="text"
       id="mobile"
       class="form-control"
       placeholder="Enter mobile number">
            </div>

            <!-- Vehicle Number -->

            <div class="mb-3">

                <label class="form-label">
                    Vehicle Number
                </label>

                <input type="text"
       id="vehicle"
       class="form-control"
       placeholder="Enter vehicle number">
            </div>

            <!-- Bill Number -->

            <div class="mb-3">

                <label class="form-label">
                    Bill Number
                </label>

                <input type="text"
       id="bill"
       class="form-control"
       placeholder="Enter bill number">
            </div>

            <!-- Fuel Liters -->

            <div class="mb-3">

                <label class="form-label">
                    Fuel Liters
                </label>

                <input type="number"
       id="liters"
       class="form-control"
       placeholder="Enter liters">
            </div>

            <!-- Date -->

            <div class="mb-3">

                <label class="form-label">
                    Bill Date
                </label>

                <input type="date"
       id="date"
       class="form-control">

            </div>

            <!-- Submit Button -->

            <div class="d-grid">

                <button class="btn btn-primary btn-lg">

                    Submit Bill

                </button>

            </div>

        </form>
        
        <hr class="my-5">

<h3 class="mb-3">
    Bill Records
</h3>

<div class="table-responsive">

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

            <tr>

                <th>Mobile</th>
                <th>Vehicle</th>
                <th>Bill No</th>
                <th>Liters</th>
                <th>Date</th>

            </tr>

        </thead>

        <tbody id="billTableBody">

        </tbody>

    </table>

</div>

    </div>

</div>

<script src="/static/script.js"></script>
</body>

</html>

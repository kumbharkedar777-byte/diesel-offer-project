<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Diesel Offer</title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>

        body{

            background-color: #f2f4f7;

        }

        /* SIDEBAR */

        .sidebar{

            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background: #1e293b;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 20px;
            z-index: 9999;

        }

        .sidebar a{

            padding: 15px 25px;
            text-decoration: none;
            font-size: 20px;
            color: white;
            display: block;
            transition: 0.2s;

        }

        .sidebar a:hover{

            background: #334155;

        }

        .sidebar i{

            margin-right: 12px;

        }

        /* DASHBOARD */

        .dashboard-card{

            border: none;
            border-radius: 20px;
            height: 190px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .dashboard-card:hover{

            transform: translateY(-5px);

        }

        .dashboard-icon{

            font-size: 55px;
            color: white;

        }

        .dashboard-title{

            color: white;
            font-weight: 600;
            margin-top: 15px;
            font-size: 22px;

        }

        /* CARD COLORS */

        .card-blue{

            background: linear-gradient(
                135deg,
                #1e88e5,
                #1565c0
            );

        }

        .card-pink{

            background: linear-gradient(
                135deg,
                #d81b60,
                #ad1457
            );

        }

        .card-green{

            background: linear-gradient(
                135deg,
                #43a047,
                #2e7d32
            );

        }

        .card-orange{

            background: linear-gradient(
                135deg,
                #fb8c00,
                #ef6c00
            );

        }

        .card-cyan{

            background: linear-gradient(
                135deg,
                #00acc1,
                #00838f
            );

        }

        .card-purple{

            background: linear-gradient(
                135deg,
                #8e24aa,
                #6a1b9a
            );

        }

        .card-dark{

            background: linear-gradient(
                135deg,
                #455a64,
                #263238
            );

        }

        .welcome-text{

            font-weight: bold;
            color: #222;
            font-size: 34px;

        }

        @media(max-width:768px){

            .dashboard-card{

                height: 170px;

            }

            .dashboard-title{

                font-size: 18px;

            }

            .dashboard-icon{

                font-size: 45px;

            }

        }

    </style>

</head>

<body>

    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <!-- CLOSE BUTTON -->

        <div class="text-end p-3">

            <button
                class="btn btn-light"
                onclick="closeSidebar()">

                ✖

            </button>

        </div>

        <!-- MENU ITEMS -->

        <a href="idx.html">

            <i class="bi bi-house-door"></i>

            Home

        </a>

        <a href="/templates/add_bill.html">

            <i class="bi bi-plus-circle"></i>

            Add Bill

        </a>

        <a href="/templates/bill_history.html">

            <i class="bi bi-clock-history"></i>

            Bill History

        </a>

        <a href="/templates/bill_by_date.html">

            <i class="bi bi-calendar-event"></i>

            Bill By Date

        </a>

        <a href="/templates/fuel_by_mobile.html">

            <i class="bi bi-phone"></i>

            Fuel By Mobile

        </a>

        <a href="/templates/offer_achiever.html">

            <i class="bi bi-trophy"></i>

            Offer Achiever

        </a>

        <a href="/templates/offer_details.html">

            <i class="bi bi-gift"></i>

            Offer Details

        </a>

        <a href="/templates/change_password.html">

            <i class="bi bi-key"></i>

            Change Password

        </a>

        <a href="#"
           onclick="logout()">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </a>

    </div>

    <!-- HEADER -->

    <nav class="navbar navbar-dark bg-primary px-3 py-3">

        <div class="container-fluid">

            <button
                class="btn text-white"
                onclick="openSidebar()">

                <i class="bi bi-list fs-1"></i>

            </button>

            <h2 class="text-white m-0 fw-bold">
                Diesel Offer
            </h2>

            <button
                class="btn btn-light"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>

    <!-- WELCOME -->

    <div class="container mt-4">

        <h2 class="welcome-text">
            Hi, Shree Petroleum
        </h2>

    </div>

    <!-- DASHBOARD STATS -->

    <div class="container">

        <div class="row mt-4 g-4">

            <!-- TOTAL BILLS -->

            <div class="col-12 col-md-4">

                <div class="card bg-primary text-white shadow p-4">

                    <h5>
                        Total Bills
                    </h5>

                    <h2 id="totalBills">
                        0
                    </h2>

                </div>

            </div>

            <!-- TOTAL USERS -->

            <div class="col-12 col-md-4">

                <div class="card bg-success text-white shadow p-4">

                    <h5>
                        Total Users
                    </h5>

                    <h2 id="totalUsers">
                        0
                    </h2>

                </div>

            </div>

            <!-- TOTAL FUEL -->

            <div class="col-12 col-md-4">

                <div class="card bg-dark text-white shadow p-4">

                    <h5>
                        Total Fuel (Liters)
                    </h5>

                    <h2 id="totalFuel">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>

    <!-- DASHBOARD -->

    <div class="container mt-4 mb-5">

        <div class="row g-4">

            <!-- ADD BILL -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/add_bill.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-blue">

                        <div class="text-center">

                            <i class="bi bi-plus-circle dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Add New Bill
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- BILL HISTORY -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/bill_history.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-pink">

                        <div class="text-center">

                            <i class="bi bi-clock-history dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Bill History
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- EDIT BILL -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/edit_bill.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-green">

                        <div class="text-center">

                            <i class="bi bi-pencil-square dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Edit Bill
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- FUEL BY MOBILE -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/fuel_by_mobile.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-cyan">

                        <div class="text-center">

                            <i class="bi bi-phone dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Fuel By Mobile
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- REDEEM OFFER -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/redeem_offer.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-purple">

                        <div class="text-center">

                            <i class="bi bi-gift dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Redeem Offer
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- REDEEM REPORT -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="/templates/redeem_offer.html"
                   class="text-decoration-none">

                    <div class="dashboard-card card-orange">

                        <div class="text-center">

                            <i class="bi bi-bar-chart dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Redeem Report
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

            <!-- ADD USER -->

            <div class="col-12 col-md-6 col-lg-4">

                <a href="#"
                   onclick="openAdminLogin()"
                   class="text-decoration-none">

                    <div class="dashboard-card card-dark">

                        <div class="text-center">

                            <i class="bi bi-person-plus dashboard-icon"></i>

                            <h4 class="dashboard-title">
                                Add User
                            </h4>

                        </div>

                    </div>

                </a>

            </div>

        </div>

    </div>

    <!-- SCRIPTS -->

    <script>

    function openSidebar(){

        document.getElementById(
            "sidebar"
        ).style.width = "280px";

    }

    function closeSidebar(){

        document.getElementById(
            "sidebar"
        ).style.width = "0";

    }

    function logout(){

        localStorage.removeItem(
            "isLoggedIn"
        );

        window.location.href =
            "/templates/login.html";

    }

    function openAdminLogin(){

        const username = prompt(
            "Enter Admin Username"
        );

        const password = prompt(
            "Enter Admin Password"
        );

        if(
            username === "kedar" &&
            password === "kedar777"
        ){

            window.location.href =
                "add_user.html";

        }

        else{

            alert(
                "Access Denied!"
            );

        }

    }

    async function loadDashboardStats(){

        const response = await fetch(

            "http://127.0.0.1:5000/dashboard_stats"

        );

        const data = await response.json();

        document.getElementById(
            "totalBills"
        ).innerText = data.total_bills;

        document.getElementById(
            "totalUsers"
        ).innerText = data.total_users;

        document.getElementById(
            "totalFuel"
        ).innerText = data.total_fuel;

    }

    loadDashboardStats();

    const isLoggedIn = localStorage.getItem(
        "isLoggedIn"
    );

    if(isLoggedIn !== "true"){

        window.location.href =
            "/templates/login.html";

    }

    </script>

</body>

</html>

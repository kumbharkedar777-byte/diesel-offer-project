<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Bill</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <nav class="navbar navbar-dark bg-warning px-3">

        <div class="container-fluid">

            <h3 class="text-dark">
                Edit Bill
            </h3>

            <a href="bill_history.html"
               class="btn btn-dark">

                Back

            </a>

        </div>

    </nav>

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h3 class="mb-4">
                Update Bill
            </h3>

            <form id="editForm">

                <input type="hidden" id="billId">

                <div class="mb-3">

                    <label>Mobile Number</label>

                    <input type="text"
                           id="mobile"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label>Vehicle Number</label>

                    <input type="text"
                           id="vehicle"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label>Bill Number</label>

                    <input type="text"
                           id="bill"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label>Fuel Liters</label>

                    <input type="number"
                           id="liters"
                           class="form-control">

                </div>

                <div class="mb-3">

                    <label>Bill Date</label>

                    <input type="date"
                           id="date"
                           class="form-control">

                </div>

                <button class="btn btn-warning w-100">

                    Update Bill

                </button>

            </form>

        </div>

    </div>

    <script src="edit.js"></script>

</body>

</html>

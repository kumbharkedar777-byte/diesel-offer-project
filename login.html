<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f2f4f7;">

    <div class="container">

        <div class="row justify-content-center align-items-center vh-100">

            <div class="col-md-5">

                <div class="card shadow p-5">

                    <h2 class="text-center mb-4">

                        Diesel Offer Login

                    </h2>

                    <form id="loginForm">

                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- Password -->

                        <div class="mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <!-- Button -->

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="login.js"></script>

</body>

</html>

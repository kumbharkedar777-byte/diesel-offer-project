<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fuel By Mobile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-success px-3">

        <div class="container-fluid">

            <h3 class="text-white">
                Fuel By Mobile
            </h3>

            <a href="idx.html"
               class="btn btn-light">

                Back

            </a>

        </div>

    </nav>

    <!-- Main Container -->

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h3 class="mb-4">
                Search Customer Bills
            </h3>

            <!-- Search -->

            <div class="row mb-4">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="mobileSearch"
                        class="form-control"
                        placeholder="Enter Mobile Number"
                    >

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-success w-100"
                        onclick="searchFuelBills()"
                    >

                        Search

                    </button>

                </div>

            </div>

            <!-- Table -->

            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Mobile</th>
                            <th>Vehicle</th>
                            <th>Bill No</th>
                            <th>Liters</th>
                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="fuelTableBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="fuel.js"></script>

</body>

</html>

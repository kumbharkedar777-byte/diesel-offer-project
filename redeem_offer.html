<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Redeem Offer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f2f4f7;">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-primary px-3">

        <div class="container-fluid">

            <h3 class="text-white">
                Redeem Offer
            </h3>

            <a href="idx.html"
               class="btn btn-light">

                Back

            </a>

        </div>

    </nav>

    <!-- FORM -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow p-4">

                    <h3 class="mb-4">
                        Redeem Customer Reward
                    </h3>

                    <form id="redeemForm">

                        <div class="mb-4">

                            <label class="form-label">

                                Mobile Number

                            </label>

                            <input
                                type="text"
                                id="mobileNumber"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Redeem Offer

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="redeem_offer.js"></script>

</body>

</html>

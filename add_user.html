<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body style="background:#f2f4f7;">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark px-3">

        <div class="container-fluid">

            <h3 class="text-white">
                Add User
            </h3>

            <a href="idx.html"
               class="btn btn-light">

                Back

            </a>

        </div>

    </nav>

    <!-- Form -->

    <div class="container mt-5">

        <div class="card shadow p-4">

            <h3 class="mb-4">
                Create New User
            </h3>

            <form id="userForm">

                <!-- Full Name -->

                <div class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="form-control"
                        required
                    >

                </div>

                <!-- Mobile -->

                <div class="mb-3">

                    <label class="form-label">
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        id="mobileNumber"
                        class="form-control"
                        required
                    >

                </div>

                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        required
                    >

                </div>

                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        required
                    >

                </div>

                <!-- Role -->

                <div class="mb-4">

                    <label class="form-label">
                        Role
                    </label>

                    <select
                        id="role"
                        class="form-select"
                    >

                        <option value="Admin">
                            Admin
                        </option>

                        <option value="Staff">
                            Staff
                        </option>

                    </select>

                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="btn btn-dark w-100">

                    Add User

                </button>

            </form>

        </div>

    </div>

    <script src="add_user.js"></script>

</body>

</html>
